<header class="menubar">
    <a class="menubar__mark" href="/" aria-label="{site.name}, home"><include src="logo-mark.html" /></a>
    <nav class="menubar__menu" aria-label="Main">
        <a href="/#projects" data-open="projects">Projects</a>
        <a href="/writing/" data-open="posts">Posts</a>
        <a href="/#tools" data-open="tools">Tools</a>
        <a href="/#contact" data-open="contact">Mail</a>
        <a href="/about/" data-open="profile">About</a>
    </nav>
    <div class="menubar__right">
        <button class="menubar__toggle" type="button" data-toggle="crt" aria-pressed="true">CRT</button>
        <button class="menubar__toggle" type="button" data-toggle="sound" aria-pressed="false">Sound</button>
        <p class="menubar__status"><span class="dot" aria-hidden="true"></span> Booking open</p>
        <p class="menubar__clock">Brussels <time data-clock>--:--</time></p>
        <a class="menubar__book" href="{site.booking}" target="_blank" rel="noopener" data-browse>Book a call</a>
    </div>
</header>
