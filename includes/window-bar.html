<div class="window__bar" data-drag>
    <a class="window__box window__close" href="{close}" data-close aria-label="Close {title}"></a>
    <p class="window__title">{title}</p>
    <button class="window__box window__min" type="button" data-min aria-label="Minimise {title}"></button>
    <button class="window__box window__zoom" type="button" data-zoom aria-label="Zoom {title}"></button>
</div>
