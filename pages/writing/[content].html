<layout src="web.html" title="{frontmatter.title} · {site.name}">
<article class="article">
    <h1>{frontmatter.title}</h1>
    <p class="article__meta"><time datetime="{frontmatter.date}">{frontmatter.date|date:"%-d %B %Y"}</time> · {content|reading_time} min read</p>
    <div class="prose">
        {content}
    </div>
</article>
<aside class="article__end">
    <h2>Need a hand with your site?</h2>
    <include src="book.html" />
</aside>
</layout>
