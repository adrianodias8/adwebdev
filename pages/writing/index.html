<layout src="web.html" title="Writing · {site.name}" description="Posts about building for the web, side projects and the tools I make.">
<section class="article">
    <h1>Writing</h1>
    <p class="article__lead">Notes on building for the web, side projects, and the tools I make along the way. Also available as a <a href="/writing/feed.xml">feed</a>.</p>
    <ol class="post-list">
        <ForEach content="writing" as="post" orderBy="date, desc" paginate="20">
        <li><a href="{post.url}"><span class="post-list__title">{post.title}</span><span class="post-list__about">{post.description}</span></a><time datetime="{post.date}">{post.date|date:"%-d %b %Y"}</time></li>
        </ForEach>
    </ol>
    <If condition="pagination.total > 1">
    <nav class="pager" aria-label="Pages">
        <If condition="pagination.has_prev"><a href="{pagination.prev_url}">Newer</a></If>
        <span>Page {pagination.current} of {pagination.total}</span>
        <If condition="pagination.has_next"><a href="{pagination.next_url}">Older</a></If>
    </nav>
    </If>
</section>
</layout>
