name: Deploy

# Builds the site with Statico and publishes it to GitHub Pages.
#
# Statico is built from its repository, for changes made after v0.1.0. Once
# v0.2.0 is released, replace the "Install Statico" step with the released
# binary:
#
#   - run: |
#       curl -fsSL "https://github.com/adrianodias8/statico/releases/download/v0.2.0/statico-x86_64-unknown-linux-musl.tar.gz" \
#         | sudo tar xz -C /usr/local/bin statico
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly, so the Stats page stays fresh.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Where the site is served. Everything root-relative is published under it.
  SITE_URL: https://adwebdev.xyz

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the Statico build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/statico
          key: statico-main-${{ runner.os }}
      - name: Install Statico
        run: |
          [ -x ~/.cargo/bin/statico ] || cargo install --git https://github.com/adrianodias8/statico --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          ~/.cargo/bin/statico --version

      # Totals and counts from Umami for the Stats page. The share link's id
      # is a secret and only its read-only token is used, here and nowhere
      # else. Without it, or if Umami is down, the page says there are no
      # numbers yet and the deploy goes ahead.
      - name: Fetch stats
        env:
          UMAMI_SHARE_ID: ${{ secrets.UMAMI_SHARE_ID }}
          STATS_SINCE: "2026-10-28T10:00:00Z"
        run: python3 .github/scripts/umami-stats.py > public/stats.json || rm -f public/stats.json

      # Fails on broken links, missing anchors, images without alt text and
      # front matter that does not match its schema.
      - name: Check
        run: statico check --strict

      - name: Build
        run: statico build "$SITE_URL"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
